<!DOCTYPE html>
<html lang="ja">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Yamato Knit Gallery</title>
	<!-- ファビコンの設定 -->
  <link rel="icon" type="image/png" href="img/favicon.png">
</head>
	<link rel="stylesheet" href="style.css">
	<meta name=”viewport” content=”width=device-width, initial-scale=1.0″>
</head>

<!--ボディここから-->

<body>
	<!--ヘッダーここから-->
	<header>
		<div class="header-element">
			<h1>
				<a href="#">
					<img src="img/logo.png" alt="logo">
				</a>
			</h1>
			<ul>
				<li><a href="#About">About</a></li>
				<li><a href="#Gallery">Gallery</a></li>
			</ul>
		</div>
	</header>

	<!--ヘッダーここまで-->
	<!--メインここから-->
	<main>
		<div class="mainvisual">
			<img src="img/mainvisual.png" alt="">
		</div>

		<!--アバウトここから-->
		<section class="About">
			<h2 id="About">About</h2>

			<div class="profire">
					<img src="img/about.png" alt="プロフィール写真">
					<div class="profire-right">
						<h3>Yamato</h3>
						<p>編み物歴１年ちょっとです。WEB制作の練習も兼ねてギャラリーサイトを作りました。<br>気ままに更新予定です。ぜひ見ていってください。
						</p>
				</div>
			</div>

		</section>
		<!--アバウトここまで-->

		<!--バイクサイクルここから-->
		<section class="Gallery">
			<h2 id="Gallery">Gallery</h2>
			<div class="Gallery-list">

				<div class="Gallery-item">
					<img src="img/papercover.png" alt="">
					<h3>ティッシュケース</h3>
				</div>

				<div class="Gallery-item">
					<img src="img/menshat.png" alt="">
					<h3>メンズニット帽</h3>
				</div>

				<div class="Gallery-item">
					<img src="img/pinkcardigan.png" alt="">
					<h3>カーディガン</h3>
				</div>
			</div>

		</section>
		<!--バイクサイクルここまで-->

	</main>
	<!--メインここまで-->
	<!--フッターここから-->
	<footer>
　<div class="copyright">
　　<p>&copy; 2026 Yamato Knit Gallery </p>
　</div>
	</footer>
	<!--フッターここまで-->
</body>
<!--ボディここまで-->

</html>
